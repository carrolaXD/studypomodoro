<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Study Pomodoro</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="browser.css">
</head>
<body>

<div class="titlebar">
  <div class="win-controls">
    <button class="win-btn win-shrink" id="btnMiniEnter" disabled data-i18n-title="miniEnter" title="Mini mode">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="7" y1="7" x2="16" y2="16"/><polyline points="16 9 16 16 9 16"/>
      </svg>
    </button>
    <button class="win-btn" id="btnWinMin" disabled data-i18n-title="winMinimize" title="Minimize">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <button class="win-btn win-close" id="btnWinClose" disabled data-i18n-title="winClose" title="Close">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
</div>

<!-- Mini widget (shown only in mini mode): back arrow, time, play/pause, progress bar -->
<div class="mini-bar" id="miniBar">
  <div class="mini-left">
    <button class="mini-back" id="btnMiniBack" data-i18n-title="miniExit" title="Back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="mini-lock" id="btnMiniLock" data-i18n-title="miniLock" title="Lock position">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="miniLockIcon">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
    </button>
  </div>
  <div class="mini-time" id="miniTime">25:00</div>
  <button class="mini-play" id="btnMiniPlay">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="miniPlayIcon"><polygon points="6,3 20,12 6,21"/></svg>
  </button>
  <div class="mini-progress"><div class="mini-progress-fill" id="miniProgressFill"></div></div>
</div>

<div class="bg-ambient" id="bgAmbient"></div>

<div class="top-left-controls">
  <button class="settings-toggle" id="btnSettingsTop" data-i18n-title="settingsTooltip" title="Settings">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <button class="settings-toggle" id="btnReport" data-i18n-title="reportTooltip" title="Report">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="8" width="4" height="13" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/><path d="M4 7l5-3 5 2 6-4"/>
      <polyline points="18 2 22 2 22 6"/>
    </svg>
  </button>
</div>

<div class="top-right-controls">
  <div class="audio-wrap" id="alarmWrap">
  <button class="alarm-toggle active" id="alarmToggle" data-i18n-title="alarmTooltip" title="Alarm" aria-expanded="false" aria-controls="alarmDropdown">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="bellIcon">
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      <line x1="1" y1="1" x2="23" y2="23" id="bellSlash" style="display:none"/>
    </svg>
  </button>
  <div class="audio-dropdown" id="alarmDropdown">
    <div id="alarmOptions"></div>
    <div class="audio-divider"></div>
    <div class="volume-row">
      <label for="alarmVolSlider" data-i18n="vol">Vol</label>
      <input type="range" min="0" max="100" value="50" class="vol-slider" id="alarmVolSlider" aria-label="Alarm volume">
    </div>
    <div class="audio-divider"></div>
    <div class="setting-toggle-row">
      <label class="setting-toggle-label" for="setAlarmEnabled" data-i18n="alarmEnabled">Alarm enabled</label>
      <label class="toggle-switch"><input type="checkbox" id="setAlarmEnabled" checked><span class="toggle-track"></span></label>
    </div>
  </div>
  </div>
  <div class="audio-wrap" id="audioWrap">
    <button class="audio-toggle" id="audioToggle" data-i18n-title="audioTooltip" title="Audio">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
    </button>
    <div class="audio-dropdown" id="audioDropdown">
      <div id="audioOptions"></div>
      <div class="audio-divider"></div>
      <div class="volume-row">
        <label for="volSlider" data-i18n="vol">Vol</label>
        <input type="range" min="0" max="100" value="50" class="vol-slider" id="volSlider">
      </div>
      <div class="audio-divider"></div>
      <div class="setting-toggle-row">
        <label class="setting-toggle-label" for="setMuteOnBreak" data-i18n="muteOnBreak">Mute during breaks</label>
        <label class="toggle-switch"><input type="checkbox" id="setMuteOnBreak"><span class="toggle-track"></span></label>
      </div>
    </div>
  </div>
</div>

<div class="app">
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="focus" data-i18n="focus">Focus</button>
    <button class="mode-tab" data-mode="short" data-i18n="pause">Break</button>
  </div>

  <div class="timer-container">
    <svg class="timer-svg" viewBox="0 0 300 300" id="timerSvg">
      <circle class="ring-bg" cx="150" cy="150" r="130"/>
      <circle class="ring-progress" cx="150" cy="150" r="130" id="ringProgress"
        stroke-dasharray="816.81" stroke-dashoffset="816.81"
        transform="rotate(-90 150 150)"/>
      <circle class="ring-track" cx="150" cy="150" r="130" id="ringTrack"/>
      <circle class="slider-handle" cx="150" cy="20" r="9" id="sliderHandle"/>
    </svg>
    <div class="timer-display">
      <div class="time-text" id="timeText">25:00</div>
      <div class="time-label" id="timeLabel">Focus</div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-secondary" id="btnReset" data-i18n-title="resetTooltip" title="Reset">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
    <button class="btn btn-play" id="btnPlay" aria-label="Start timer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIcon">
        <polygon points="6,3 20,12 6,21"/>
      </svg>
    </button>
    <button class="btn btn-secondary" id="btnSettings" data-i18n-title="timesTooltip" title="Times">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2h12"/><path d="M6 22h12"/><path d="M7 2v4.4a2 2 0 0 0 .7 1.5l3.8 3.3a1 1 0 0 1 0 1.6l-3.8 3.3a2 2 0 0 0-.7 1.5V22"/><path d="M17 2v4.4a2 2 0 0 1-.7 1.5l-3.8 3.3a1 1 0 0 0 0 1.6l3.8 3.3a2 2 0 0 1 .7 1.5V22"/>
      </svg>
    </button>
  </div>
</div>

<!-- Timer Settings -->
<div class="settings-overlay" id="settingsOverlay">
  <div class="settings-panel">
    <button class="panel-close" id="btnCloseSettings" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    <div class="settings-title" data-i18n="setTime">Set time</div>
    <div class="picker-hint" data-i18n="pickerHint">Scroll or type</div>
    <div class="setting-group">
      <div class="setting-label" data-i18n="focusTime">Focus Time</div>
      <div class="setting-input-row">
        <div class="wheel"><div class="wheel-scroll" id="wheelFocusH" data-max="9"></div></div>
        <span class="setting-unit" data-i18n="hrs">h</span>
        <div class="wheel"><div class="wheel-scroll" id="wheelFocusM" data-max="59" data-pad></div></div>
        <span class="setting-unit" data-i18n="min">min</span>
      </div>
    </div>
    <div class="setting-group timer-break-group">
      <div class="setting-label" data-i18n="breakTime">Break</div>
      <div class="setting-input-row">
        <div class="wheel"><div class="wheel-scroll" id="wheelShortH" data-max="9"></div></div>
        <span class="setting-unit" data-i18n="hrs">h</span>
        <div class="wheel"><div class="wheel-scroll" id="wheelShortM" data-max="59" data-pad></div></div>
        <span class="setting-unit" data-i18n="min">min</span>
      </div>
    </div>
    <div class="timer-options">
      <div class="setting-toggle-row">
        <span class="setting-toggle-label" id="autoStartLabel" data-i18n="autoStart">Auto-start next timer</span>
        <label class="toggle-switch">
          <input type="checkbox" id="setAutoStart" aria-labelledby="autoStartLabel">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="setting-toggle-row">
        <label class="setting-toggle-label" for="setContinueAfterZero" data-i18n="continueAfterZero">Continue after 0</label>
        <label class="toggle-switch"><input type="checkbox" id="setContinueAfterZero"><span class="toggle-track"></span></label>
      </div>
    </div>
  </div>
</div>

<!-- App Settings -->
<div class="settings-overlay" id="appSettingsOverlay">
  <div class="settings-panel">
    <button class="panel-close" id="btnCloseAppSettings" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    <div class="settings-title" data-i18n="appSettings">Application</div>
    <div class="setting-toggle-row">
      <span class="setting-toggle-label" id="minimizeLabel" data-i18n="minimizeOnClose">Minimize on close</span>
      <label class="toggle-switch">
        <input type="checkbox" id="setCloseToTray" aria-labelledby="minimizeLabel" autocomplete="off">
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="setting-group" style="margin-top:14px;margin-bottom:0">
      <div class="setting-label" id="langLabel" data-i18n="language">Language</div>
      <div class="language-picker" id="languagePicker">
        <button class="setting-input language-trigger" id="setLang" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="langLabel languageValue"><span id="languageValue">English</span><svg class="language-chevron" width="12" height="16" viewBox="0 0 16 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 7 3-3 3 3m-6 6 3 3 3-3"/></svg></button>
        <div class="language-menu" id="languageMenu" role="listbox" aria-labelledby="langLabel" hidden></div>
      </div>
    </div>
    <div class="setting-group" style="margin-top:14px;margin-bottom:0">
      <div class="theme-heading">
        <div class="setting-label" data-i18n="themeColor">Theme</div>
        <button class="custom-theme-toggle" id="btnCustomTheme" aria-expanded="false" aria-controls="customThemeOverlay" data-i18n-title="customTheme" title="Custom theme">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="9" r="1"/><circle cx="14" cy="7" r="1"/><circle cx="17" cy="12" r="1"/><path d="M8 16h4l2 3"/></svg>
        </button>
      </div>
      <div class="accent-swatches" id="accentSwatches"></div>

    </div>
    <div class="account-row" id="accountRow">
      <div class="account-out" id="accountOut">
        <div class="account-text">
          <span class="account-title" data-i18n="acctTitle">Account</span>
          <span class="account-sub" id="accountSub" data-i18n="acctSubtitle">Sync across devices</span>
        </div>
        <button class="btn-google" id="btnSignIn" disabled data-i18n-title="acctSignIn" title="Sign in with Google">
          <svg class="g-logo" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span data-i18n="acctSignInShort">Sign in</span>
        </button>
      </div>
      <div class="account-in" id="accountIn" hidden>
        <div class="account-user">
          <div class="account-avatar" id="accountAvatar"></div>
          <div class="account-text">
            <span class="account-email" id="accountEmail"></span>
            <span class="account-sub"><span class="sync-dot" id="syncDot"></span><span id="syncStatus"></span></span>
          </div>
        </div>
        <button class="btn-signout" id="btnSignOut" data-i18n="acctSignOut">Sign out</button>
      </div>
    </div>
    <button class="btn-feedback" id="btnFeedback" data-i18n="feedback">Report a bug or idea 💬</button>
    <button class="btn-donate" id="btnDonate" data-i18n="donate">Support the app</button>
  </div>
</div>

<div class="settings-overlay color-overlay" id="customThemeOverlay" role="dialog" aria-modal="true" aria-labelledby="customThemeTitle">
  <div class="settings-panel color-panel">
    <button class="panel-close" id="btnCloseCustomTheme" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    <div class="settings-title" id="customThemeTitle" data-i18n="customTheme">Custom theme</div>
    <div class="color-targets" id="customThemeColors">
      <button class="color-target active" id="colorFocus" data-color="focus" aria-pressed="true"><i></i><span data-i18n="focus">Focus</span></button>
      <button class="color-target" id="colorBreak" data-color="break" aria-pressed="false"><i></i><span data-i18n="pause">Break</span></button>
      <button class="color-target" id="colorBackground" data-color="background" aria-pressed="false"><i></i><span data-i18n="backgroundColor">Background</span></button>
    </div>
    <div class="color-field" id="colorField" aria-hidden="true"><span id="colorCursor"></span></div>
    <input class="color-hue" id="colorHue" data-i18n-title="colorHue" type="range" min="0" max="359" value="0" aria-label="Hue">
    <div class="color-value-row"><span id="colorPreview"></span><label for="colorHex">HEX</label><input id="colorHex" maxlength="7" spellcheck="false" autocomplete="off" value="#ff6b6b"></div>
    <div class="saved-themes">
      <div class="saved-themes-heading">
        <span data-i18n="savedThemes">Saved themes</span>
        <div class="saved-theme-actions">
          <button class="theme-action" id="btnSaveTheme" data-i18n-title="saveTheme" title="Save current theme"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="theme-action" id="btnDeleteTheme" data-i18n-title="deleteTheme" title="Delete selected theme" disabled><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"/></svg></button>
        </div>
      </div>
      <div class="saved-theme-swatches" id="savedThemeSwatches"></div>
    </div>
  </div>
</div>

<!-- Report -->
<div class="settings-overlay" id="reportOverlay">
  <div class="report-panel">
    <button class="panel-close" id="btnCloseReport" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    <div class="report-title" data-i18n="statistics">Statistics</div>

    <!-- period view switch -->
    <div class="stats-views" id="statsViews">
      <button class="stats-view-btn" data-view="week" data-i18n="week">Week</button>
      <button class="stats-view-btn" data-view="month" data-i18n="month">Month</button>
      <button class="stats-view-btn" data-view="year" data-i18n="year">Year</button>
    </div>

    <!-- prev / period label / next -->
    <div class="stats-period">
      <button class="stats-arrow" id="statsPrev" aria-label="Previous">‹</button>
      <div class="stats-period-label" id="statsPeriodLabel">-</div>
      <button class="stats-arrow" id="statsNext" aria-label="Next">›</button>
    </div>

    <!-- hero total for the selected period -->
    <div class="stats-hero" id="statsHero">0m</div>

    <!-- the trend curve (SVG + scrub overlay injected by stats.js) -->
    <div class="stats-chart" id="statsChart"></div>
    <div class="stats-axis" id="statsAxis"></div>

    <!-- three cards -->
    <div class="stats-cards">
      <div class="stats-card">
        <div class="stats-card-value" id="statDelta">-</div>
        <div class="stats-card-label" data-i18n="vsPrev">vs previous</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-value" id="statAvg">0m</div>
        <div class="stats-card-label" data-i18n="avgPerDay">Avg/day</div>
      </div>
      <div class="stats-card">
        <div class="stats-card-value" id="statTotal">0h</div>
        <div class="stats-card-label" data-i18n="total">Total</div>
      </div>
    </div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script src="js/audio.js"></script>
<script src="js/sample-stats.js"></script>
<script src="js/stats.js"></script>
<script src="js/prefs.js"></script>
<script src="js/timer.js"></script>
<script src="js/appearance.js"></script>
<script src="js/alarm-menu.js"></script>
<script src="js/wheels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
